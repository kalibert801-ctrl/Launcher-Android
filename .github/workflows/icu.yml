name: ICU для Windows-программ (Qt 6)

# Qt 6 (и PySide6) на Windows берёт ICU из самой Windows: icuuc.dll / icuin.dll с функциями без номера
# версии (u_strlen, а не u_strlen_76). В Wine 9.2 таких DLL нет. Собираем ICU (unicode.org, лицензия ICU/MIT)
# кросс-компилятором MinGW с U_DISABLE_RENAMING — получаются DLL «как в Windows».
# Результат — Release icu-<версия> (prerelease); AleksOS ставит его из «Компонентов Windows».

on:
  push:
    branches: [main]
    paths: [components/ICU, .github/workflows/icu.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Версия
        run: echo "V=$(tr -d '[:space:]' < components/ICU)" >> "$GITHUB_ENV"

      - name: Инструменты
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64 g++-mingw-w64-x86-64-posix g++-mingw-w64-i686-posix gcc-mingw-w64-x86-64-posix gcc-mingw-w64-i686-posix

      - name: Собрать
        run: |
          set -o pipefail
          U="${V//./_}"; T="${V//./-}"
          curl -fsSL "https://github.com/unicode-org/icu/releases/download/release-$T/icu4c-$U-src.tgz" -o icu.tgz
          tar -xzf icu.tgz
          # 1) инструменты ICU для этого компьютера (нужны, чтобы собрать данные для Windows)
          mkdir host && (cd host && ../icu/source/runConfigureICU Linux --disable-tests --disable-samples > ../host.log 2>&1 && make -j"$(nproc)" >> ../host.log 2>&1) \
            || { tail -40 host.log; echo "::error::ICU host: $(grep -iE 'error' host.log | head -5 | tr -s '[:space:]' ' ')"; exit 1; }
          build() {
            local host=$1 dir=$2
            mkdir "b-$dir"
            (cd "b-$dir" && \
              CC=$host-gcc-posix CXX=$host-g++-posix \
              CPPFLAGS="-DU_DISABLE_RENAMING=1" CFLAGS="-O2" CXXFLAGS="-O2" \
              LDFLAGS="-static-libgcc -static-libstdc++" \
              ../icu/source/configure --host=$host --with-cross-build="$PWD/../host" \
                --disable-tests --disable-samples --disable-extras --disable-tools --disable-icuio --disable-layoutex \
                --with-data-packaging=library --enable-shared --disable-static > ../b-$dir.log 2>&1 && \
              make -j"$(nproc)" >> ../b-$dir.log 2>&1) \
              || { tail -40 "b-$dir.log"; echo "::error::ICU $dir: $(grep -E ' error: |Error [0-9]|undefined reference|multiple definition|cannot find|[*][*][*]' b-$dir.log | head -8 | tr -s '[:space:]' ' ' | cut -c1-2500)"; exit 1; }
            mkdir -p "pkg/$dir"
            find "b-$dir" -name "*.dll" | tee /dev/stderr
            for f in $(find "b-$dir" -name "icu*.dll"); do cp "$f" "pkg/$dir/"; done
            # библиотека потоков MinGW — рядом с ICU (в Wine её нет)
            cp "$(find /usr/lib/gcc/$host /usr/$host -name libwinpthread-1.dll 2>/dev/null | head -1)" "pkg/$dir/"
          }
          build x86_64-w64-mingw32 system32
          build i686-w64-mingw32 syswow64
          M="${V%%.*}"
          for d in system32 syswow64; do
            # Qt ищет DLL «как в Windows» — без номера версии
            cp "pkg/$d/icuuc$M.dll" "pkg/$d/icuuc.dll"
            cp "pkg/$d/icuin$M.dll" "pkg/$d/icuin.dll"
            ls -la "pkg/$d"
          done
          # проверка: функции без номера версии и без лишних зависимостей
          x86_64-w64-mingw32-objdump -p pkg/system32/icuuc.dll | grep -E "^\s+\[.*\] u_strlen$|DLL Name" | head -20
          x86_64-w64-mingw32-objdump -p pkg/system32/icuuc.dll | grep -qE "\] u_strlen$" || { echo "::error::в icuuc.dll нет функции u_strlen без номера версии"; exit 1; }
          tar --format=gnu --owner=0 --group=0 -C pkg -czf "icu-$V.tar.gz" system32 syswow64
          SIZE=$(stat -c %s "icu-$V.tar.gz"); SHA=$(sha256sum "icu-$V.tar.gz" | cut -d' ' -f1)
          echo "{\"version\":\"$V\",\"url\":\"https://github.com/${{ github.repository }}/releases/download/icu-$V/icu-$V.tar.gz\",\"size\":$SIZE,\"sha256\":\"$SHA\"}" > "icu-$V.json"
          cat "icu-$V.json"

      - name: Опубликовать
        uses: softprops/action-gh-release@v2
        with:
          tag_name: icu-${{ env.V }}
          name: ICU ${{ env.V }} для Windows-программ (AleksOS)
          body: ICU ${{ env.V }} (unicode.org, лицензия Unicode/ICU), собран MinGW без переименования функций — icuuc.dll / icuin.dll «как в Windows» для программ на Qt 6.
          files: |
            icu-${{ env.V }}.tar.gz
            icu-${{ env.V }}.json
          prerelease: true
          make_latest: false
