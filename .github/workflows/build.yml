name: Сборка APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: NDK и CMake для нативной части движка
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null

      - name: Русская локаль для движка Windows
        # glibc 2.31 — как в образе движка (Debian bullseye); файлы кладутся в APK (assets/locale)
        run: |
          mkdir -p app/src/main/assets/locale
          docker run --rm -v "$PWD/app/src/main/assets/locale:/out" debian:bullseye sh -c "apt-get update -qq && apt-get install -y -qq locales > /dev/null && (localedef -i ru_RU -f UTF-8 /out/ru_RU.utf8 || true) && test -f /out/ru_RU.utf8/LC_CTYPE && chmod -R a+rX /out"
          ls -la app/src/main/assets/locale/ru_RU.utf8

      - name: Сборка
        env:
          ALEKSOS_KEY_PASSWORD: ${{ secrets.ALEKSOS_KEY_PASSWORD }}
        run: |
          if [ -z "$ALEKSOS_KEY_PASSWORD" ]; then
            echo "::error::Нет секрета ALEKSOS_KEY_PASSWORD (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          ./gradlew assembleRelease --no-daemon

      - name: Переименовать APK
        run: cp app/build/outputs/apk/release/app-release.apk "AleksOS-Launcher-${{ github.run_number }}.apk"

      - name: Сохранить APK (вкладка Actions)
        uses: actions/upload-artifact@v4
        with:
          name: AleksOS-Launcher-${{ github.run_number }}
          path: AleksOS-Launcher-${{ github.run_number }}.apk

      - name: Опубликовать в Releases (только ветка main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AleksOS Launcher, сборка ${{ github.run_number }}
          files: AleksOS-Launcher-${{ github.run_number }}.apk
          make_latest: true
