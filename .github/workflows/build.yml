name: Сборка APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: NDK и CMake для нативной части движка
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null

      - name: Сборка
        run: ./gradlew assembleDebug --no-daemon

      - name: Переименовать APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "AleksOS-Launcher-${{ github.run_number }}.apk"

      - name: Сохранить APK (вкладка Actions)
        uses: actions/upload-artifact@v4
        with:
          name: AleksOS-Launcher-${{ github.run_number }}
          path: AleksOS-Launcher-${{ github.run_number }}.apk

      - name: Опубликовать в Releases (только ветка main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AleksOS Launcher, сборка ${{ github.run_number }}
          files: AleksOS-Launcher-${{ github.run_number }}.apk
          make_latest: true
